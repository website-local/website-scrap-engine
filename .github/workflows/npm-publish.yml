# Test and publish to npm when a GitHub release is created.
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      # npm 12 supports trusted publishing and requires a recent Node 22 or 24.
      - name: Update npm
        run: npm install -g npm@12
      - run: npm ci
      - run: npm publish --access public
