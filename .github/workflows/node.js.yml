# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI
permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.13.0, 22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
    - run: node test/runtime-smoke.js
    - name: Validate installed package and declarations
      run: |
        consumer="$RUNNER_TEMP/wse-consumer"
        mkdir "$consumer"
        npm pack --ignore-scripts --pack-destination "$consumer"
        echo '{"private":true,"type":"module"}' > "$consumer/package.json"
        npm install --prefix "$consumer" --no-package-lock --no-audit "$consumer"/website-scrap-engine-*.tgz
        node scripts/check-consumer.mjs "$consumer" --smoke-only
